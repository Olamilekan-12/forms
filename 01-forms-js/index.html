<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forms in JS</title>
</head>
<body>
<form id="signup" action="/signup" method="post">
  <label>Name <input type="text" name="username" value="Ada" /></label>
  <label>Age <input type="number" name="age" min="0" max="120" step="1" /></label>
  <label>Volume <input type="range" name="volume" min="0" max="10" value="3" /></label>
  <label>Birthday <input type="date" name="birthday" /></label>
  <label>Colour <input type="color" name="colour" value="#ff0000" /></label>
  <input type="hidden" name="source" value="landing-page" />

  <button type="submit">Send</button>
</form>
  <script src="script.js"></script>
</body>
</html>
